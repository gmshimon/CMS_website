name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  backend:
    name: 🧪 Run Backend
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Node.js (with cache)
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "Backend/package-lock.json"
      - name: Install Dependencies
        working-directory: Backend
        run: npm ci

  frontend:
    name: 🏁 Run Frontend
    runs-on: ubuntu-latest
    needs: backend
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'development' }}
    strategy:
      matrix:
        node-version: [18]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Node.js (with cache)
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            CMS_frontend/package-lock.json
      - name: Install Dependencies
        working-directory: CMS_frontend
        run: npm ci --legacy-peer-deps

      - name: Start frontend
        working-directory: CMS_frontend
        run: npm start &

    #   - name: npm run lint
        # working-directory: CMS_frontend
        # run: npm run lint
  build-and-publish:
    name: 📦 Build and Publish
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'development' }}

    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
            registry: docker.io
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v4
        with: 
            context: Backend
            file: Backend/Dockerfile
            push: true
            tags: |
                gmshimon/cms_backend:latest
                gmshimon/cms_backend:${{ github.sha }}
            build-args: |
                NODE_ENV=production
                PORT=5000
            
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with: 
            context: CMS_frontend
            file: CMS_frontend/Dockerfile
            push: true
            tags: |
                gmshimon/cms_frontend:latest
                gmshimon/cms_frontend:${{ github.sha }}
            build-args: |
                NODE_ENV=production




 