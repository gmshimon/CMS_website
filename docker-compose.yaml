version: '3.8'
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    volumes:
      - './Backend:/app'
      - 'backend_node_modules:/app/node_modules'
  frontend:
    build:
      context: ./CMS_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - './CMS_frontend:/app'
      - 'frontend_node_modules:/app/node_modules'
    depends_on:
      - backend
volumes:
  frontend_node_modules:
  backend_node_modules: